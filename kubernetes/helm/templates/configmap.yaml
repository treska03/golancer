{{- range $name, $cm := .Values.configMaps }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "golancer.labels" $ | nindent 4 }}
data:
  {{- range $file, $content := $cm.data }}
  {{- /* Strings are used verbatim; anything else is serialised as YAML. */}}
  {{ $file }}: |
    {{- if kindIs "string" $content }}
    {{- $content | trimSuffix "\n" | nindent 4 }}
    {{- else }}
    {{- toYaml $content | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
