# Baseline backend servers loaded into the pool on startup.
# Additional backends can still be registered at runtime via the API.
backends:
  - url: http://127.0.0.1:2115
    weight: 2
  - url: http://127.0.0.1:2215
    weight: 3
  - url: http://127.0.0.1:2315
    weight: 5

# Load Balancing settings. Algorithm is selected by specifying strategy.
# Possible strategies: 'ip-hash', 'least-connections', 'random', 'round-robin'
balancing:
  strategy: least-connections
  max-retries: 3 # max backend retries per request before returning an error
  server:
    port: 8080 # port the proxy listens on
    read-timeout: 5s # max duration for reading the entire request
    write-timeout: 10s # max duration before timing out writes of the response

# Proxy settings.
proxy:
  body-limit: 16384 # max request body in bytes (default 16 KiB when omitted)
  # CIDRs/IPs of reverse proxies in front of the balancer (ingress, cloud LB).
  # Only their X-Forwarded-For/-Proto are believed; ip-hash then keys on the
  # real client IP instead of the proxy's. Empty = trust no one.
  trusted-proxies: []

# Active health probing. Backends are only routed to once a probe succeeds, and
# are evicted after unhealthy-threshold consecutive failures.
health:
  interval: 15s # delay between probe rounds
  healthy-threshold: 1 # consecutive successes to (re)admit a backend
  unhealthy-threshold: 3 # consecutive failures to evict a backend
  max-concurrent: 0 # max backends probed in parallel (0 = unbounded)
  client:
    timeout: 2s # per-probe request timeout
    path: /healthz # path probed on each backend (expects 2xx)

discovery:
  mode: self-registration # possible modes: self-registration (default), kubernetes-discovery
  # Used only with mode: kubernetes-discovery. Watches the Service's EndpointSlices and
  # balances across its *ready* pod IPs directly (not via the ClusterIP).
  kubernetes:
    namespace: "" # Service namespace (default: this pod's namespace)
    service: "" # Service whose pods are balanced (required)
    port-name: "" # Service port, by name, to send traffic to ("" = the unnamed port)
    api-server: "" # outside a cluster only, e.g. http://127.0.0.1:8001 from `kubectl proxy`
  registry:
    server:
      port: 8081 # port the registry API listens on
      read-timeout: 5s # max duration for reading the entire request
      write-timeout: 10s # max duration before timing out writes of the response

observability:
  metrics:
    server:
      port: 2112 # port the metrics registry API listens on
      read-timeout: 5s # max duration for reading the entire request
      write-timeout: 10s # max duration before timing out writes of the response
